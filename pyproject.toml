[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fitfleet"
dynamic = ["version"]
description = "Run many scikit-learn models x feature subsets x hyper-parameters in parallel and keep the best."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "shaizae" }]
keywords = ["machine-learning", "scikit-learn", "hyperparameter-search", "feature-selection", "multiprocessing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "joblib>=1.4",
    "threadpoolctl>=3.5",
    "tqdm>=4.66",
    "matplotlib>=3.9",
    "reportlab>=4.2",
]

[project.urls]
Homepage = "https://github.com/shaizae/fitfleet"
Issues = "https://github.com/shaizae/fitfleet/issues"

[project.scripts]
fitfleet = "fitfleet.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "psutil>=6"]

[tool.setuptools.dynamic]
version = { attr = "fitfleet.__version__" }

[tool.setuptools.packages.find]
include = ["fitfleet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
